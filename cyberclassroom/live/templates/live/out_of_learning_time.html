<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ยังไม่ถึงเวลาเรียน</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <style>
    body {
      background: linear-gradient(135deg, #8e44ad, #3498db);
      color: #fff;
      font-family: 'Segoe UI', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
    }

    .box {
      background-color: rgba(0, 0, 0, 0.3);
      padding: 3rem;
      border-radius: 20px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.4);
      max-width: 600px;
      width: 100%;
    }

    h1 {
      font-size: 2.5rem;
      margin-bottom: 1rem;
    }

    .lead {
      font-size: 1.2rem;
    }

    .time-range {
      font-size: 1.5rem;
      font-weight: bold;
      color: #ffeaa7;
    }

    #digital-clock {
      font-family: monospace;
      font-size: 2.5rem;
      color: #ffdc00;
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <div class="box">
    <h1>⏳ ระบบยังไม่เปิดให้รับชม</h1>
    <p class="lead">ระบบเปิดให้เข้าชมระหว่างเวลา:</p>
    <div class="time-range">{{ start_time }} - {{ end_time }}</div>
    <div id="digital-clock">--:--:--</div>
    <p class="mt-3">กรุณากลับมาใหม่ในช่วงเวลาที่กำหนด</p>
  </div>

  <script>
    // เวลาเปิดเรียน
    const startHour = 7;
    const startMinute = 0;

    // แสดงนาฬิกาปัจจุบันแบบไม่กระพริบ
    function updateClock() {
      const now = new Date();
      const h = now.getHours().toString().padStart(2, '0');
      const m = now.getMinutes().toString().padStart(2, '0');
      const s = now.getSeconds().toString().padStart(2, '0');
      document.getElementById('digital-clock').textContent = `${h}:${m}:${s}`;
    }

    // เช็คแค่ทุกๆ 15 วินาที ว่าถึงเวลาเปิดเรียนหรือยัง
    function checkTimeAndReload() {
      const now = new Date();
      const h = now.getHours();
      const m = now.getMinutes();

      if (h > startHour || (h === startHour && m >= startMinute)) {
        location.reload(); // middleware จะปล่อยให้เข้าได้เอง
      }
    }

    // เรียกใช้ฟังก์ชัน
    updateClock();
    setInterval(updateClock, 1000);
    setInterval(checkTimeAndReload, 15000);
  </script>
</body>
</html>
