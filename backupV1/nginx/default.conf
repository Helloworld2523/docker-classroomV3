# nginx/default.conf
limit_req_zone $binary_remote_addr zone=search_limit:10m rate=10r/m;

server {
    listen 80;

    # ❌ บล็อก IP ที่ยิงหนัก
    deny 52.167.144.0/24;
    deny 40.77.167.0/24;
    deny 40.76.0.0/15;
    deny 13.66.0.0/16;

    # ✅ ปล่อย IP อื่นใช้งานได้
    allow all;

    location /searchRoom {
        # limit_req zone=search_limit burst=5 nodelay;
        if ($http_user_agent ~* "(bingbot|curl|python|requests|wget|scrapy|bot|spider|crawl)") {
            return 444;
        }
        # ถ้าไม่ใช่ bot ให้ส่งต่อไปยัง uwsgi
        include uwsgi_params;
        uwsgi_pass django:8080;
    }
    location = /robots.txt {
        alias /var/www/static/robots.txt;
        access_log off;
        log_not_found off;
    }
    location / {
        include uwsgi_params;
        uwsgi_pass django:8080;
    }

    location /static {
        alias /var/www/static;
    }
}
