<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <title>ถ่ายทอดสดทั้งหมด</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="refresh" content="120">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      background-color: #f0f2f5;
      font-size: 0.85rem;
    }
    .viewer-count {
      font-size: 0.9rem;
      color: #198754;
      font-weight: 600;
    }
    .card-title {
      font-size: 0.95rem;
      font-weight: 600;
      color: #333;
      margin-bottom: 0.25rem;
    }
    .stream-url {
      font-size: 0.75rem;
      color: #666;
      word-break: break-word;
      margin-bottom: 0.5rem;
    }
    .card-body {
      padding: 0.75rem;
    }
    @media (min-width: 1200px) {
      .col-xl-8col {
        flex: 0 0 auto;
        width: 12.5%;
      }
    }

    .flash-transition {
      transition: background-color 0.8s ease;
    }
  </style>
</head>
<body>
  <div class="container-fluid py-3">
    <h5 class="text-center mb-3">📺 ถ่ายทอดสดทั้งหมด (เฉพาะ Staff/Admin)</h5>

    <div class="row">
      {% for room in live_classrooms %}
        <div class="col-sm-6 col-md-4 col-lg-3 col-xl-8col mb-3">
          <div class="card shadow-sm h-80 flash-transition">
            <div class="card-body">
              <h6 class="card-title">
                <a href="{% url 'showSubjectInRoom' room=room.room_name %}" class="text-decoration-none text-primary fw-semibold" role="button" aria-pressed="true" target="_blank">
                  {{ room.room_name }}
                </a>
                <span class="viewer-count" id="viewer-{{ room.room_name|slugify }}">
                  👥 {{ room.viewer_count }} คน
                </span>
              </h6>
            </div>
          </div>
        </div>
      {% empty %}
        <p class="text-center">ไม่มีห้องถ่ายทอดสดในขณะนี้</p>
      {% endfor %}
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    function slugify(text) {
      return text.toString().toLowerCase().trim().replace(/\s+/g, '-').replace(/[^\w\-]+/g, '');
    }

    function getRandomFlashColor() {
      const colors = ['#ffe8a1', '#d1e7dd', '#f8d7da', '#cff4fc', '#fff3cd', '#e2e3e5'];
      return colors[Math.floor(Math.random() * colors.length)];
    }

    function flashCard(cardEl) {
      if (!cardEl) return;
      const originalBg = cardEl.style.backgroundColor;
      const newColor = getRandomFlashColor();
      cardEl.style.backgroundColor = newColor;

      setTimeout(() => {
        cardEl.style.backgroundColor = '';
      }, 800);
    }

    async function updateViewerCounts() {
      try {
        const response = await fetch("{% url 'live_viewer_data' %}");
        const json = await response.json();

        json.data.forEach(room => {
          const viewerEl = document.querySelector(`#viewer-${slugify(room.room_name)}`);
          const cardEl = viewerEl?.closest('.card');

          if (viewerEl && cardEl) {
            const currentText = viewerEl.textContent.trim();
            const newText = `👥 ${room.viewer_count} คน`;

            if (currentText !== newText) {
              viewerEl.textContent = newText;
              flashCard(cardEl);
            }
          }
        });
      } catch (err) {
        console.error('Failed to update viewer counts', err);
      }
    }

    updateViewerCounts();
    setInterval(updateViewerCounts, 5000);
  </script>
</body>
</html>
