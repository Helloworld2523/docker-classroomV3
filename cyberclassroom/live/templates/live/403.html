<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>403 Forbidden</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <style>
        body, html {
            height: 100%;
            background: linear-gradient(135deg, #6a11cb, #2575fc);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: white;
        }
        .container {
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 0 1rem;
        }
        .error-code {
            font-size: 8rem;
            font-weight: 700;
            text-shadow: 2px 2px 10px rgba(0,0,0,0.4);
        }
        .error-message {
            font-size: 2rem;
            margin-bottom: 1rem;
            font-weight: 600;
            text-shadow: 1px 1px 6px rgba(0,0,0,0.3);
        }
        .error-description {
            font-size: 1.2rem;
            max-width: 450px;
            margin-bottom: 2rem;
            color: #d0d0ffcc;
        }
        .btn-home {
            background-color: white;
            color: #6a11cb;
            font-weight: 600;
            padding: 0.75rem 2.5rem;
            border-radius: 50px;
            text-decoration: none;
            box-shadow: 0 4px 15px rgba(106, 17, 203, 0.4);
            transition: background-color 0.3s ease, color 0.3s ease;
        }
        .btn-home:hover {
            background-color: #6a11cb;
            color: white;
            box-shadow: 0 6px 20px rgba(106, 17, 203, 0.7);
        }
        .icon-lock {
            font-size: 5rem;
            margin-bottom: 20px;
            color: #ffc107;
            text-shadow: 1px 1px 6px rgba(0,0,0,0.3);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon-lock">
            <svg xmlns="http://www.w3.org/2000/svg" width="80" height="80" fill="currentColor" class="bi bi-lock-fill" viewBox="0 0 16 16">
              <path d="M2.5 9a1 1 0 0 1 1-1h9a1 1 0 0 1 1 1v5a1 1 0 0 1-1 1h-9a1 1 0 0 1-1-1V9z"/>
              <path d="M4.5 5a3.5 3.5 0 0 1 7 0v2h-7V5z"/>
            </svg>
        </div>
        <div class="error-code">403</div>
        <div class="error-message">Forbidden</div>
        <div class="error-description">
            คุณไม่มีสิทธิ์เข้าใช้งานหน้านี้ หรือถูกจำกัดการเข้าถึง หากคิดว่ามีปัญหา กรุณาติดต่อผู้ดูแลระบบ
        </div>
        <a href="/" class="btn-home">กลับสู่หน้าหลัก</a>
    </div>
</body>
</html>
