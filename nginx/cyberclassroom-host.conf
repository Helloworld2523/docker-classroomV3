# nginx config สำหรับติดตั้งบน HOST (ไม่ใช่ใน Docker)
# copy ไปไว้ที่: /etc/nginx/conf.d/cyberclassroom.conf
# แล้วรัน: sudo nginx -t && sudo systemctl reload nginx

# rate limiting
limit_req_zone $binary_remote_addr zone=perip:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=search_limit:10m rate=10r/m;

server {
    listen 80;
    server_name cyberclassroom.ru.ac.th 10.3.68.55;

    # Static files — serve โดยตรงจาก host path (เร็วกว่าส่งผ่าน Django)
    location /static/ {
        alias /home/user/docker-classroomV2/cyberclassroom/staticfiles/;
        expires 0;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    }

    location = /robots.txt {
        alias /home/user/docker-classroomV2/cyberclassroom/staticfiles/robots.txt;
        access_log off;
        log_not_found off;
    }

    # บล็อก bot
    location /searchRoom {
        if ($http_user_agent ~* "(bingbot|curl|python|requests|wget|scrapy|bot|spider|crawl)") {
            return 444;
        }
        proxy_pass http://127.0.0.1:8082;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # SSE endpoint
    location = /monitor-sse/ {
        proxy_pass              http://127.0.0.1:8082;
        proxy_set_header        Host $host;
        proxy_set_header        X-Real-IP $remote_addr;
        proxy_read_timeout      120s;
        proxy_buffering         off;
        proxy_cache             off;
        proxy_set_header        Connection '';
        proxy_http_version      1.1;
        chunked_transfer_encoding on;
    }

    # ทุก request อื่น
    location / {
        proxy_pass http://127.0.0.1:8082;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;        # $remote_addr = IP จริงของ client ✓
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
