{% load static %}
<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ถ่ายทอดสดพิธีรับปริญญา</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
body {
    background: url("{% static 'bg.png' %}") no-repeat center top;
    background-size: cover;
    background-attachment: fixed;
    height: 100vh;
    display: flex;
    /* align-items: center;*/
    justify-content: center; 
    color: white;
    text-align: center;
}

/* Add an overlay effect on top of the background */
body::before {
    content: "";
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.2); /* Adjust transparency */
    z-index: 0; /* Keep it behind the content */
}

/* Ensure content stays above the overlay */
.content {
    position: relative;
    z-index: 1;
    color: white;
    text-align: center;
    padding-top: 50px;
}

.parallax {
    background: url("{% static 'bg.png' %}") no-repeat center top;
    background-size: cover;
    background-attachment: fixed;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    text-align: center;
}

        video {
            width: 100%;
            max-width: 800px;
            border: 5px solid white;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.7);
        }
        @media (max-width: 768px) {
            h1 { font-size: 24px; }
        }
        img {
    max-width: 100%;
    height: auto;
}
    </style>
    <script>
        document.addEventListener("scroll", function () {
    let scrollPosition = window.scrollY;
    document.body.style.backgroundPosition = "center " + (scrollPosition * 0.5) + "px";
});

    </script>
</head>
<body>

<div class="overlay"></div>

<div class="container content" >
    <div class="row" style="padding-bottom: 20px;">
        <div class="col-md-12">
            <div class="text-center">
                <img src="{% static 'hd-bn.png' %}" alt="Banner" class="img-fluid" width="600px">
            </div>
            
        </div>
</div>
<div class="row" style="padding-bottom: 20px;">
    <div class="col-md-12">
      <div id="videoContainer" class="video-container" style="display: none;">
        <video id="liveStream" controls playsinline></video>
    </div>
    <button id="startButton" class="btn btn-primary">เริ่มเล่นวิดีโอ</button>
    </div>
    </div>
</div>

<script>
  var video = document.getElementById('liveStream');
  var videoSrc = "http://202.41.160.68:1935/live/rucom/playlist.m3u8";
  var startButton = document.getElementById('startButton');
  var videoContainer = document.getElementById('videoContainer');

  function startVideo() {
      if (Hls.isSupported()) {
          var hls = new Hls();
          hls.loadSource(videoSrc);
          hls.attachMedia(video);
          hls.on(Hls.Events.MANIFEST_PARSED, function () {
              video.muted = false; // เปิดเสียง
              video.play().catch(error => console.log("Autoplay failed:", error));
          });
      } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
          video.src = videoSrc;
          video.muted = false; // เปิดเสียง
          video.addEventListener('loadedmetadata', function () {
              video.play().catch(error => console.log("Autoplay failed:", error));
          });
      }

      // แสดงวิดีโอและซ่อนปุ่ม
      videoContainer.style.display = "block";
      startButton.style.display = "none";
  }

  startButton.addEventListener("click", startVideo);
</script>

</body>
</html>
