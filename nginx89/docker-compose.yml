version: "3.7"

services:

  nginx89:
    image: nginx:latest
    container_name: nginx89
    restart: always
    ports:
      - "8849:8849"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./default.conf:/etc/nginx/conf.d/default.conf
      - ../cyberclassroom/staticfiles:/var/www/static:ro
    networks:
      - classroom_net

networks:
  classroom_net:
    external: true
