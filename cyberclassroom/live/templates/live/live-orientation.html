{% load static %}
<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>พิธีปฐมนิเทศนักศึกษาใหม่ 2568</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        body {
            background: url("{% static '090-249-2724.png' %}") no-repeat center top;
            background-size: cover;
            background-attachment: fixed;
            height: 100vh;
            display: flex;
            justify-content: center;
            color: white;
            text-align: center;
        }

        /* กำหนดพื้นหลังของตัว video container */
        .video-container {
            position: relative;
            width: 100%;
            max-width: 800px;
            background: url("{% static 'bg_0.png' %}") no-repeat center center;
            background-size: cover;
            /*height: 450px;*/ /* ปรับขนาดตามที่ต้องการ */
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.7);
        }

        video {
            width: 100%;
            height: 100%;
            border-radius: 10px;
            object-fit: cover; /* ทำให้วิดีโอเติมเต็มพื้นที่ */
            opacity: 0;
            transition: opacity 1s ease-in-out;
        }

        /* เมื่อ video เริ่มเล่นแล้วให้แสดง */
        video.loaded {
            opacity: 1;
        }

        img {
            max-width: 100%;
            height: auto;
        }
        @keyframes blink {
            0% { opacity: 1; }
            50% { opacity: 0.2; }
            100% { opacity: 1; }
        }
        
        .blink-button {
            background-color: red;
            color: white;
            font-weight: bold;
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            animation: blink 1s infinite;
            box-shadow: 0 0 10px rgba(255, 0, 0, 0.7);
        }
    </style>
    <script>
        /*document.addEventListener("scroll", function () {
    let scrollPosition = window.scrollY;
    document.body.style.backgroundPosition = "center " + (scrollPosition * 0.5) + "px";
});*/

    </script>
</head>
<body>

<div class="overlay"></div>

<div class="container content" >
    <div class="row" style="padding-bottom: 20px;">
        <div class="col-md-12">
            <div class="text-center">
                <img src="{% static 'hd-bn_0.png.png' %}" alt="Banner" class="img-fluid" width="600px">
            </div>
            
        </div>
</div>
<div class="row justify-content-center" style="padding-bottom: 20px;">
    <!--<div class="d-flex justify-content-center mt-3">
        <button class="blink-button">🔴 ทดสอบสัญญาณการถ่ายทอดสด</button>
    </div>-->
    <div class="col-md-8">
        <div class="video-container">
            <video id="liveStream" controls autoplay playsinline class="w-100 rounded shadow"></video>
        </div>

        <!-- แสดงจำนวนผู้รับชม ด้านล่างของวิดีโอ -->
        <div class="d-flex justify-content-center mt-3">
            <div class="card bg-danger text-white shadow-sm px-3 py-2" style="border-radius: 12px;">
                <div class="d-flex align-items-center">
                    <i class="bi bi-eye-fill me-2"></i> <!-- ไอคอนรูปตา -->
                    <span>ผู้รับชมขณะนี้:</span>
                    <span id="sessions_total" class="ms-2 fw-bold">{{ sessions_total }}</span>
                </div>
            </div>
        </div>
        <!-- ปุ่มลิงก์ไปยัง YouTube -->
        <div class="d-flex justify-content-center mt-3">
            <a href="https://www.youtube.com/live/frzv6b_MynA" target="_blank" class="btn btn-danger fw-bold px-4 py-2 shadow-sm">
                ▶️ รับชมผ่าน YouTube
            </a>
        </div>
    </div>
</div>


<script>
    var video = document.getElementById('liveStream');
    var videoSrc = "http://202.41.160.68:1935/live/rucom/playlist.m3u8";

    if (Hls.isSupported()) {
        var hls = new Hls({
            debug: false,           // ปิด debug log
            startLevel: -1,         // เริ่มเล่นทันทีโดยไม่ต้องโหลด
            autoStartLoad: true,    // ให้เริ่มโหลดทันทีที่มีสัญญาณ
            capLevelToPlayerSize: true, // ลดคุณภาพให้เหมาะสมกับขนาดของจอ
            enableWorker: false,    // ปิดการใช้ Web Worker เพื่อไม่ให้มีการโหลดข้อมูลเป็นขั้นตอน
        });
        hls.loadSource(videoSrc);
        hls.attachMedia(video);
        hls.on(Hls.Events.MANIFEST_PARSED, function () {
            video.muted = true;  // ปิดเสียงเพื่อให้ autoplay ทำงาน
            video.play().catch(error => console.log("Autoplay failed:", error));
        });
        // เมื่อสตรีมเริ่มโหลดและพร้อมเล่น ให้เพิ่ม class 'loaded' ให้กับ video
        hls.on(Hls.Events.LEVEL_LOADED, function () {
        video.classList.add('loaded');
        document.querySelector('.video-container').style.background = 'none';  // ลบพื้นหลังเมื่อ video เริ่มเล่น
        });

    } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
        video.src = videoSrc;
        video.muted = true; // ปิดเสียงเพื่อให้ autoplay ทำงาน
        video.addEventListener('loadedmetadata', function () {
            video.play().catch(error => console.log("Autoplay failed:", error));
            document.querySelector('.video-container').style.background = 'none';  // ลบพื้นหลังเมื่อ video เริ่มเล่น
        });
    }

    function updateViewers() {
        fetch("{% url 'get-live-viewers' %}")  // เรียก API
        .then(response => response.json())  // แปลง JSON
        .then(data => {
            document.getElementById("sessions_total").innerText = data.sessions_total;
        })
        .catch(error => console.error("Error fetching viewers:", error));
    }

    // อัปเดตทุกๆ 5 วินาที
    setInterval(updateViewers, 5000);
</script>

</body>
</html>
