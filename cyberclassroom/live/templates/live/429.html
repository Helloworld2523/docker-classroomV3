<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>429 Too Many Requests</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <style>
        body, html {
            height: 100%;
            background: linear-gradient(135deg, #ff7e5f, #feb47b);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .container {
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            color: white;
            flex-direction: column;
        }
        .error-code {
            font-size: 8rem;
            font-weight: 700;
            text-shadow: 2px 2px 8px rgba(0,0,0,0.3);
        }
        .error-message {
            font-size: 1.5rem;
            margin-bottom: 1rem;
            text-shadow: 1px 1px 6px rgba(0,0,0,0.2);
        }
        .suggestion {
            font-size: 1.1rem;
            margin-bottom: 2rem;
            color: #ffe;
            max-width: 400px;
        }
        .btn-home {
            background-color: #fff;
            color: #ff7e5f;
            font-weight: 600;
            padding: 0.75rem 2rem;
            border-radius: 50px;
            transition: background-color 0.3s ease, color 0.3s ease;
            text-decoration: none;
            box-shadow: 0 4px 15px rgba(255, 126, 95, 0.4);
        }
        .btn-home:hover {
            background-color: #ff7e5f;
            color: white;
            box-shadow: 0 6px 20px rgba(255, 126, 95, 0.7);
        }
        .icon-warning {
            font-size: 5rem;
            margin-bottom: 20px;
            color: #fff3cd;
            text-shadow: 1px 1px 6px rgba(0,0,0,0.2);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon-warning">
            <svg xmlns="http://www.w3.org/2000/svg" width="80" height="80" fill="currentColor" class="bi bi-exclamation-triangle-fill" viewBox="0 0 16 16">
              <path d="M8.982 1.566a1.13 1.13 0 0 0-1.96 0L.165 13.233c-.457.778.091 1.767.98 1.767h13.71c.889 0 1.438-.99.98-1.767L8.982 1.566zM8 5c.535 0 .954.462.9.995l-.35 3.507a.552.552 0 0 1-1.1 0L7.1 5.995A.905.905 0 0 1 8 5zm.002 6a1 1 0 1 1-2.002 0 1 1 0 0 1 2.002 0z"/>
            </svg>
        </div>
        <div class="error-code">429</div>
        <div class="error-message">Too Many Requests</div>
        <div class="suggestion">
            คุณได้ส่งคำขอมากเกินไปในช่วงเวลาสั้น ๆ กรุณารอสักครู่แล้วลองใหม่อีกครั้ง
        </div>
        <a href="/" class="btn-home">กลับสู่หน้าหลัก</a>
    </div>
</body>
</html>
